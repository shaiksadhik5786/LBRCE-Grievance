spring.application.name=college-grievance-system
spring.profiles.default=local

# Override these values with environment variables for deployment. Production must
# activate the prod profile so its required JWT_SECRET setting is used.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Stable local key keeps sessions valid across backend restarts.
app.jwt.secret=${JWT_SECRET:}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://localhost:4173}
app.bootstrap.admin-enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin-roll-id=ADM001
app.bootstrap.admin-name=Sai Charan
app.bootstrap.admin-email=yaramala.saicharan@gmail.com
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# The API key is server-only. Never expose it through a VITE_ variable or client code.
app.otp.base-url=${BREVO_OTP_BASE_URL:https://brevootpservice-production.up.railway.app}
app.otp.api-key=${BREVO_OTP_API_KEY:}
app.otp.verification-ttl=${OTP_VERIFICATION_TTL:10m}
app.otp.connect-timeout=${OTP_CONNECT_TIMEOUT:5s}
app.otp.read-timeout=${OTP_READ_TIMEOUT:10s}
